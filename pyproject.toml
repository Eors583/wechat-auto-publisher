[project]
name = "wechat-auto-publisher"
version = "1.3.0"
description = "Local CLI to rewrite articles and push WeChat Official Account drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "trafilatura>=1.12.0",
  "readability-lxml>=0.8.1",
  "apscheduler>=3.10.0",
  "google-genai>=1.0.0",
  "pillow>=10.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "lark-oapi>=1.7.1",
  "psycopg[binary]>=3.2.0",
  "cryptography>=44.0.0",
]

[project.scripts]
wechat-auto = "app.cli:app"
wechat-auto-ui = "app.frontend.server:main"
wechat-auto-api = "app.api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["render/templates/*.j2", "frontend/dist/**"]
